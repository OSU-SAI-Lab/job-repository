[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fss"
version = "0.1.0"
description = "Training-free few-shot segmentation: DINOv3 dense matching + SAM 3 refinement."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OSU SAI Lab" }]
dependencies = [
    # Pins verified against the official Transformers model docs (see requirements.txt).
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=5.12.0",
    "pillow>=10.0.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
fss = "fss.cli:main"

[tool.setuptools]
packages = ["fss"]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that download/load model weights (skip if offline).",
]
